<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  button,input,select,textarea{font-family:inherit}
  html,body{margin:0;padding:0;background:#f4f6f8;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;color:#34414d}
  a{color:#0f8f88}a:hover{color:#0b7772}
  @keyframes studioLoading{0%,100%{opacity:1}50%{opacity:.62}}
</style>
</helmet>
<div style="width:1440px;height:900px;display:flex;flex-direction:column;background:#f4f6f8;overflow:hidden;position:relative">

  <nav style="height:58px;min-height:58px;padding:0 18px;display:flex;flex-direction:row;align-items:center;gap:18px;overflow:hidden;border-bottom:1px solid #d9e0e5;background:#fff;box-shadow:0 2px 12px rgba(23,33,43,.06);flex:0 0 58px">
    <div style="flex:0 0 auto;min-width:205px;height:100%;padding:0 18px 0 0;display:flex;align-items:center;gap:10px;border-right:1px solid #d9e0e5">
      <div role="img" aria-label="Foto nazorati logosi" style="width:34px;height:34px;flex:0 0 34px;border:1px solid #b9ddda;border-radius:7px;background:#fff url('outputs/review-ui/assets/foto-nazorati-logo.svg') center/30px 30px no-repeat"></div>
      <div>
        <b style="display:block;color:#17212b;font-size:14px;font-weight:700;line-height:1.2">Foto nazorati</b>
        <span style="display:block;margin-top:2px;color:#6d7c89;font-size:10px;line-height:1.2">Savdo foto hisobotlari nazorati</span>
      </div>
    </div>
    <div style="min-width:0;flex:1 1 auto;height:100%;display:flex;flex-direction:row;align-items:center;gap:4px;overflow:hidden">
      <div style="flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:3px;padding:0 4px;border-right:1px solid #edf0f2">
        <button style="position:relative;min-width:max-content;min-height:34px;padding:7px 10px;border:1px solid #c7e2df;border-radius:6px;background:#e8f5f3;color:#0b7772;font-size:11px;font-weight:700;line-height:1;white-space:nowrap;cursor:pointer">Foto Review<span style="position:absolute;left:10px;right:10px;bottom:-7px;height:2px;border-radius:2px;background:#0f8f88"></span></button>
        <button style="min-width:max-content;min-height:34px;padding:7px 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:#586875;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer">Tabel</button>
        <button style="min-width:max-content;min-height:34px;padding:7px 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:#586875;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer">Statistika</button>
      </div>
      <div style="flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:3px;padding:0 4px;border-right:1px solid #edf0f2">
        <button style="min-width:max-content;min-height:34px;padding:7px 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:#586875;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer">Minus ro'yxati</button>
        <button style="min-width:max-content;min-height:34px;padding:7px 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:#586875;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer">Excel</button>
        <button style="min-width:max-content;min-height:34px;padding:7px 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:#586875;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer">Agent Excel</button>
      </div>
      <div style="flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:3px;padding:0 4px">
        <button style="min-width:max-content;min-height:34px;padding:7px 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:#586875;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer">Brend sozlamalari</button>
        <button style="min-width:max-content;min-height:34px;padding:7px 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:#586875;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer">Avto tekshiruv</button>
      </div>
    </div>
    <button type="button" style="display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:7px 10px;border:1px solid #d9e0e5;border-radius:7px;background:#fff;color:#6d7c89;font-size:11px;font-weight:600;line-height:1;cursor:pointer;flex:0 0 auto">
      <span style="width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#22a06b;box-shadow:0 0 0 3px rgba(34,160,107,.14)"></span><span>Server ishlayapti</span>
    </button>
  </nav>

  <header style="position:relative;height:72px;min-height:72px;padding:9px 16px;display:grid;grid-template-columns:minmax(200px,1fr) minmax(270px,320px) auto auto;grid-template-rows:1fr;align-items:center;gap:14px;border-bottom:1px solid #d9e0e5;background:#fff;flex:0 0 72px">
    <div style="min-width:0">
      <div style="color:#17212b;font-size:18px;font-weight:700;line-height:1.18;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Foto nazorati</div>
      <div style="margin-top:3px;color:#6d7c89;font-size:11px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Lalaku mama · 2026-06-03 · 42 agent · 1 284 foto</div>
    </div>
    <div style="width:100%">
      <div style="display:grid;grid-template-columns:repeat(3,minmax(82px,1fr));gap:6px">
        <div style="min-width:0;min-height:44px;padding:6px 9px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;border:1px solid #d9e0e5;border-radius:7px;background:#fff">
          <span style="overflow:hidden;color:#6d7c89;font-size:9.5px;line-height:1.1;text-overflow:ellipsis;white-space:nowrap">Agent</span><b style="flex:0 0 auto;color:#17212b;font-size:17px;line-height:1;font-weight:700">42</b>
        </div>
        <div style="min-width:0;min-height:44px;padding:6px 9px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;border:1px solid #d9e0e5;border-radius:7px;background:#fff">
          <span style="overflow:hidden;color:#6d7c89;font-size:9.5px;line-height:1.1;text-overflow:ellipsis;white-space:nowrap">Foto</span><b style="flex:0 0 auto;color:#17212b;font-size:17px;line-height:1;font-weight:700">1284</b>
        </div>
        <div style="min-width:0;min-height:44px;padding:6px 9px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;border:1px solid #efc2c7;border-radius:7px;background:#fff3f4">
          <span style="overflow:hidden;color:#6d7c89;font-size:9.5px;line-height:1.1;text-overflow:ellipsis;white-space:nowrap">Minus</span><b style="flex:0 0 auto;color:#17212b;font-size:17px;line-height:1;font-weight:700">37</b>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;min-width:0">
      <button type="button" style="display:flex;align-items:center;gap:7px;min-height:38px;padding:6px 10px;border:1px solid #d9e0e5;border-radius:7px;background:#fff;color:#536675;font-size:10px;font-weight:600;line-height:1.1;cursor:pointer;white-space:nowrap"><span>Tekshirilmagan</span><b style="padding:3px 6px;border-radius:999px;background:#e8f5f3;color:#0b7772;font-size:10px">318 / 1284</b></button>
      <button type="button" disabled style="min-height:38px;padding:6px 10px;border:1px solid #d9e0e5;border-radius:7px;background:#fff;color:#536675;font-size:10px;font-weight:600;line-height:1.1;white-space:nowrap;opacity:.48;cursor:not-allowed">Bekor qilish</button>
    </div>
    <button type="button" style="min-width:94px;min-height:38px;height:38px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid #bddbd8;border-radius:7px;background:#e8f5f3;color:#0b7772;font-weight:700;font-size:13px;cursor:pointer">
      <span>Filtrlar</span><i style="width:7px;height:7px;display:block;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg)"></i>
    </button>
  </header>

  <div style="height:calc(900px - 58px - 72px - 62px);padding:9px 14px 10px;background:#f4f6f8;flex:0 0 auto">
    <main style="min-width:0;min-height:0;height:100%;overflow:hidden">
      <div style="height:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch;align-content:start;grid-auto-rows:minmax(360px,45vh)">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
          <div style="position:relative;height:100%;overflow:hidden;border:1px solid #d9e0e5;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(23,33,43,.05)">
            <div style="position:absolute;inset:0;display:grid;place-items:center;background:#eef2f4">
              <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,#e7ecef 0 8px,#eef2f4 8px 16px)"></div>
              <span style="position:relative;color:#80909d;font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace">do'kon fotosi</span>
            </div>
            <div style="position:absolute;left:10px;right:10px;bottom:10px;padding:8px 9px;border:1px solid rgba(217,224,229,.96);border-radius:6px;background:rgba(255,255,255,.95);color:#34414d;box-shadow:0 8px 20px rgba(23,33,43,.12);backdrop-filter:blur(6px);font-size:11px;line-height:1.3">
              <b style="color:#17212b;font-weight:700">{{ c.head }}</b><br>{{ c.client }}<br>{{ c.order }}<br>{{ c.time }}
            </div>
          </div>
        </sc-for>
      </div>
    </main>
  </div>

  <div style="height:62px;padding:8px 14px;display:grid;grid-template-columns:minmax(120px,1fr) minmax(150px,1.2fr) minmax(120px,1fr) minmax(205px,.72fr) minmax(210px,.72fr);gap:8px;align-items:center;border-top:1px solid #d9e0e5;background:#fff;box-shadow:0 -4px 18px rgba(23,33,43,.07);flex:0 0 62px">
    <button style="min-height:44px;border:1px solid #bcc8d0;border-radius:6px;background:#f8fafb;color:#17212b;font-size:13px;font-weight:600;line-height:1;cursor:pointer">Oldingi</button>
    <button style="min-height:44px;border:1px solid #0f8f88;border-radius:6px;background:#0f8f88;color:#fff;font-size:13px;font-weight:700;line-height:1;cursor:pointer">Resume</button>
    <button style="min-height:44px;border:1px solid #0f8f88;border-radius:6px;background:#0f8f88;color:#fff;font-size:13px;font-weight:700;line-height:1;cursor:pointer">Keyingi</button>
    <div style="height:44px;min-width:0;display:grid;grid-template-columns:auto 50px auto minmax(66px,auto);gap:6px;align-items:center;padding-left:8px;border-left:1px solid #d9e0e5;color:#6d7c89;font-size:11px;white-space:nowrap">
      <label>Ko'rinish</label>
      <input type="number" value="4" style="width:50px;min-height:34px;padding:6px 5px;border:1px solid #d9e0e5;border-radius:6px;background:#fff;text-align:center;font-size:13px;font-weight:700;line-height:1;color:#17212b">
      <span>ta</span>
      <button style="min-width:66px;min-height:34px;padding:6px 9px;border:1px solid #bcc8d0;border-radius:6px;background:#f8fafb;color:#34414d;font-size:11px;cursor:pointer">Barchasi</button>
    </div>
    <div style="height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding-left:8px;border-left:1px solid #d9e0e5">
      <button style="min-height:34px;padding:6px 12px;border:1px solid #d9e0e5;border-radius:6px;background:#fff;color:#34414d;cursor:pointer">-</button>
      <span style="color:#17212b;font-size:12px;font-weight:700">3.5s</span>
      <button style="min-height:34px;padding:6px 12px;border:1px solid #d9e0e5;border-radius:6px;background:#fff;color:#34414d;cursor:pointer">+</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals(){
    const rows=[
      ['LMJNM08 #1','Bekzod Market','Buyurtma: 1 240 000','Vaqt: 09:14'],
      ['LMJNM08 #2','Oqtepa Savdo','Buyurtma: 860 000','Vaqt: 09:41'],
      ['LMJNM08 #3','Chorsu Mini Market','Buyurtma: 0','Vaqt: 10:05'],
      ['LMJNM08 #4','Yunusobod 12 do\u2018kon','Buyurtma: 2 105 000','Vaqt: 10:28']
    ];
    return {cards: rows.map(r=>({head:r[0],client:r[1],order:r[2],time:r[3]}))};
  }
}
</script>
</body>
</html>
